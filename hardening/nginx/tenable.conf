# http{} контекст -------------------------------------------------------------
server_tokens off;
client_max_body_size      1m;          # API не принимает файлы
client_body_timeout       10s;         # slowloris
client_header_timeout     10s;
send_timeout              15s;
keepalive_timeout         15s;
large_client_header_buffers 4 8k;

# Реальный IP за Cloudflare/LB: ТОЛЬКО их подсети, иначе X-Forwarded-For подделывается и обходит limit_req.
# set_real_ip_from <CIDR вашего LB/CF>;  real_ip_header X-Forwarded-For;  real_ip_recursive on;

limit_req_zone  $binary_remote_addr zone=api:20m    rate=20r/s;
limit_req_zone  $binary_remote_addr zone=auth:10m   rate=5r/m;     # brute-force login/refresh
limit_req_zone  $binary_remote_addr zone=expensive:10m rate=6r/m;  # /parser/start (стоит денег)
limit_conn_zone $binary_remote_addr zone=perip:20m;
limit_req_status  429;
limit_conn_status 429;

# Блокировка сканеров по User-Agent (дёшево; от целевых атак не защищает — это шумоподавление)
map $http_user_agent $bad_ua {
    default 0;
    "~*(sqlmap|nikto|nmap|masscan|zgrab|acunetix|nessus|wpscan|dirbuster|gobuster|feroxbuster|nuclei|havij|openvas|burp|fuzz faster|httpx|python-requests/2\.[0-9]+ .*scan)" 1;
    ""  1;                                   # пустой UA
}
# Типовые пути сканеров
map $request_uri $bad_path {
    default 0;
    "~*(^|/)(\.env|\.git|\.svn|\.DS_Store|wp-login|wp-admin|xmlrpc\.php|phpmyadmin|phpinfo|cgi-bin|vendor/phpunit|actuator|\.aws|id_rsa|config\.json|backup\.(zip|sql|tar))" 1;
    "~*(\.\./|%2e%2e|%00|<script|union(%20|\+)select)" 1;
}
map $request_method $bad_method { default 0; ~^(TRACE|TRACK|CONNECT)$ 1; }

server {
    listen 80; server_name tenable.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl; http2 on; server_name tenable.example;
    ssl_certificate     /etc/ssl/tenable/fullchain.pem;
    ssl_certificate_key /etc/ssl/tenable/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;
    ssl_stapling on; ssl_stapling_verify on;

    limit_conn perip 40;
    if ($bad_ua)     { return 444; }
    if ($bad_path)   { return 444; }
    if ($bad_method) { return 405; }

    # --- SPA: строгий CSP (без inline-скриптов; Vite-сборка с хешированными бандлами) ---
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
    # style 'unsafe-inline' — компромисс для Tailwind/Radix; убрать, когда будет nonce-пайплайн.

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
        limit_req zone=api burst=40 nodelay;
    }
    location /assets/ { root /usr/share/nginx/html; add_header Cache-Control "public, max-age=31536000, immutable" always; }

    # --- API ---
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;      # перезаписываем, не дописываем
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Correlation-ID $request_id;      # если клиент не прислал — см. TRACING.md
        proxy_set_header Connection "";
        proxy_read_timeout 30s; proxy_connect_timeout 3s;
        proxy_hide_header X-Powered-By;
    }
    location ~ ^/api/v1/auth/(login|refresh)$ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /api/v1/parser/start {
        limit_req zone=expensive burst=3 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    # служебное — наружу не отдаём
    location ~ ^/(docs|redoc|openapi\.json|metrics|health/internal) { return 404; }
}
