name: production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}   # деплои никогда не отменяем на полпути

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - run: pip install "ruff==0.8.6"
      - run: ruff check --output-format=github .
      - run: ruff format --check .
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      REDIS_URL: redis://127.0.0.1:6379/0
      DATABASE_URL: postgresql+asyncpg://invalid:invalid@127.0.0.1:5432/none   # unit-тесты без БД
      SUPABASE_URL: https://example.supabase.co
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q --maxfail=5 --cov=app --cov-report=term-missing --cov-fail-under=60
      - name: Dependency audit
        run: pip install pip-audit && pip-audit -r requirements.txt --strict

  iac:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.9.8" }
      - run: terraform -chdir=infra/terraform fmt -check -recursive
      - run: terraform -chdir=infra/terraform init -backend=false && terraform -chdir=infra/terraform validate
      - name: Trivy config scan (Terraform + Dockerfile + compose)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

  build:
    needs: [lint, test, iac]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
      id-token: write          # для keyless-подписи cosign
      security-events: write   # загрузка SARIF
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }

      # 1) собираем в локальный docker, НЕ пушим
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: tenable-serm:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2) Trivy: образ должен пройти ДО публикации
      - name: Trivy image scan (gate)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: tenable-serm:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: "1"
          format: sarif
          output: trivy.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: trivy.sarif }

      # 3) публикуем только на main (тот же кэш -> без пересборки), с SBOM и provenance
      - name: Push
        id: push
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@v3
        if: github.ref == 'refs/heads/main'
      - name: Sign image
        if: github.ref == 'refs/heads/main'
        run: cosign sign --yes "${IMAGE_NAME}@${{ steps.push.outputs.digest }}"
      - id: ref
        if: github.ref == 'refs/heads/main'
        run: echo "image=${IMAGE_NAME}@${{ steps.push.outputs.digest }}" >> "$GITHUB_OUTPUT"

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production        # Settings -> Environments: required reviewers = ручной апрув
      url: https://${{ vars.DOMAIN }}
    steps:
      - uses: actions/checkout@v4
      - name: SSH setup (pinned host key)
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts   # ssh-keyscan делается один раз вручную
      - name: Sync deploy files + secrets
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          ENV_FILE: ${{ secrets.PROD_ENV_FILE }}     # весь .env одним секретом
        run: |
          scp -o StrictHostKeyChecking=yes infra/devops/deploy/docker-compose.prod.yml infra/devops/deploy/Caddyfile infra/devops/deploy/deploy.sh "deploy@${HOST}:/opt/tenable/"
          printf '%s\n' "$ENV_FILE" "DOMAIN=${{ vars.DOMAIN }}" | ssh -o StrictHostKeyChecking=yes "deploy@${HOST}" 'umask 077; cat > /opt/tenable/.env'
      - name: Deploy (auto-rollback on failed healthcheck)
        run: |
          ssh -o StrictHostKeyChecking=yes "deploy@${{ secrets.DEPLOY_HOST }}" \
            "echo '${{ secrets.GHCR_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin && /opt/tenable/deploy.sh '${{ needs.build.outputs.image }}'"
      - name: Smoke test
        run: |
          for i in $(seq 1 12); do
            curl -fsS "https://${{ vars.DOMAIN }}/health" && exit 0; sleep 5
          done; echo "::error::smoke failed"; exit 1
