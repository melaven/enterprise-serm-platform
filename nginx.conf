# Главный конфиг nginx (reverse proxy перед FastAPI). Виртуальные хосты: conf.d/default.conf.template.
user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;

    # Структурные логи в stdout: их забирает docker (json-file с ротацией). Без query string: в ней бывают токены.
    log_format main '$remote_addr - $request_method $uri $status $body_bytes_sent '
                    'rt=$request_time urt=$upstream_response_time rid=$request_id';
    access_log /dev/stdout main;

    # --- Защита от перегрузки и медленных клиентов ---
    client_max_body_size 1m; # API на JSON; вебхук Stripe < 512 КБ
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;
    reset_timedout_connection on;

    limit_req_zone $binary_remote_addr zone=api_rl:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_rl:10m rate=2r/s;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
    limit_req_status 429;
    limit_conn_status 429;

    gzip on;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 512;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      "";
    }

    upstream api_backend {
        server api:8000 max_fails=3 fail_timeout=5s;
        keepalive 32;
    }

    include /etc/nginx/conf.d/*.conf;
}
