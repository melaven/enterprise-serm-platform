[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-serm-platform"
version = "0.1.0"
description = "Autonomous B2B SERM & Lead Engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqladmin>=0.20.1",
    "itsdangerous>=2.1.0",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "aiosqlite>=0.19.0",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0,<2",
    "google-genai>=0.3.0",
    "openai>=1.0.0",
    "pyjwt[crypto]>=2.8.0",
    "python-multipart>=0.0.6",
    "httpx>=0.27.0",
    "playwright>=1.40.0",
    "arq>=0.26",
    "redis>=5.0.0",
    "structlog>=23.2.0",
    "supabase>=2.0.0",
    "email-validator>=2.0.0",
    "stripe>=5.0.0",
    "cryptography>=41.0.0",
    "aiosmtplib>=3.0.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = [
    "ruff==0.8.6",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=4.0",
    "pytest-mock>=3.12",
    "types-redis>=4.6.0",
    "types-pyyaml>=6.0.12",
    "ipython>=8.18.0",
    "ipdb>=0.13.13",
]
bot = [
    "aiogram>=3.13,<4",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["app", "tests"]
extend-exclude = ["alembic/versions", "migrations"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = [
    "E501",  # TODO: Fix line length violations incrementally
    "B008",  # FastAPI pattern: function calls in defaults (Depends, Header, etc.)
    "B904",  # TODO: Add `raise ... from` in except blocks incrementally
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.10"
strict = false
# Базовые проверки для постепенного внедрения
warn_redundant_casts = true
warn_unused_ignores = true
# Отключаем строгие проверки для постепенного внедрения
warn_return_any = false
no_implicit_optional = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/", "migrations/"]
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["supabase.*", "gotrue.*", "postgrest.*"]
ignore_missing_imports = true

# Постепенное внедрение строгой типизации: отключаем strict для проблемных модулей
[[tool.mypy.overrides]]
module = [
    "app.repositories.*",
    "app.services.*",
    "app.routers.*",
    "app.core.middleware",
    "app.core.llm_cache",
    "app.core.dependencies",
    "app.core.jwt_handler",
    "app.core.exceptions",
    "app.models.*"
]
disallow_untyped_defs = false
check_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
