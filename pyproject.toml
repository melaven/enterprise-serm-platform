[tool.ruff]
line-length = 88
target-version = "py310"
src = ["app", "tests"]
extend-exclude = ["alembic/versions", "migrations"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/", "migrations/"]
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["supabase.*", "gotrue.*", "postgrest.*"]
ignore_missing_imports = true

# Для постепенного внедрения strict на легаси-модулях раскомментируй:
# [[tool.mypy.overrides]]
# module = ["app.legacy.*"]
# disallow_untyped_defs = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
