[tool.ruff]
line-length = 88
target-version = "py310"
src = ["app", "tests"]
extend-exclude = ["alembic/versions", "migrations"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = [
    "E501",  # TODO: Fix line length violations incrementally
    "B008",  # FastAPI pattern: function calls in defaults (Depends, Header, etc.)
    "B904",  # TODO: Add `raise ... from` in except blocks incrementally
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.10"
strict = false
# Базовые проверки для постепенного внедрения
warn_redundant_casts = true
warn_unused_ignores = true
# Отключаем строгие проверки для постепенного внедрения
warn_return_any = false
no_implicit_optional = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/", "migrations/"]
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["supabase.*", "gotrue.*", "postgrest.*"]
ignore_missing_imports = true

# Постепенное внедрение строгой типизации: отключаем strict для проблемных модулей
[[tool.mypy.overrides]]
module = [
    "app.repositories.*",
    "app.services.*",
    "app.routers.*",
    "app.core.middleware",
    "app.core.llm_cache",
    "app.core.dependencies",
    "app.core.jwt_handler",
    "app.core.exceptions",
    "app.models.*"
]
disallow_untyped_defs = false
check_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
